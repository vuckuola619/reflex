[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "agent-reflex"
version = "1.0.0rc2"
description = "Open, model-agnostic decision runtime for agent harnesses: deterministic first, semantic second, model last."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Agent Reflex contributors"}]
keywords = ["agents", "decision-engine", "mcp", "policy", "ai", "agentic"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = ["pydantic>=2.8,<3"]

[project.optional-dependencies]
semantic = ["sentence-transformers>=3,<7", "numpy>=1.26,<3"]
local-model = ["transformers>=4.45,<6", "torch>=2.4"]
jev = ["pydantic-ai-slim[typesafe]>=2.46,<3"]
mcp = ["mcp>=2,<3"]
server = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1"]
otel = ["opentelemetry-api>=1.27,<2"]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.6,<1",
  "mypy>=1.11,<2",
  "build>=1.2,<2",
  "twine>=7,<8",
  "httpx2>=2.13,<3",
  "python-dotenv>=1.2,<2",
  "psutil>=7.2,<8",
]
security = ["pip-audit>=2.7,<3"]
all = [
  "sentence-transformers>=3,<7",
  "numpy>=1.26,<3",
  "transformers>=4.45,<6",
  "torch>=2.4",
  "pydantic-ai-slim[typesafe]>=2.46,<3",
  "mcp>=2,<3",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "opentelemetry-api>=1.27,<2",
]

[project.scripts]
agent-reflex = "agent_reflex.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_reflex"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "benchmarks", "docs", "examples", "skills", "policies", "scripts", "deploy", "constraints", "*.md", "LICENSE", "pyproject.toml", "Dockerfile", "compose.yaml", "uv.lock", "pylock.toml", "requirements*.txt"]
exclude = [".env", ".env.*", "artifacts", "dist", "build", "**/__pycache__"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = [".venv", "dist", "build"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
exclude = ["benchmarks/", "examples/"]

[tool.coverage.run]
source = ["agent_reflex"]
branch = true
omit = [
  "src/agent_reflex/cli.py",
  "src/agent_reflex/mcp.py",
  "src/agent_reflex/providers/jev.py",
  "src/agent_reflex/providers/transformers.py",
]

[tool.coverage.report]
show_missing = true
fail_under = 90

[[tool.mypy.overrides]]
module = ["torch", "transformers", "sentence_transformers", "numpy", "pydantic_ai"]
ignore_missing_imports = true
