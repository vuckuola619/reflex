name: benchmark-jev
on:
  workflow_dispatch:
    inputs:
      dataset:
        description: Frozen JSONL dataset path
        required: true
        default: benchmarks/demo.jsonl
      jev_model:
        description: Pinned Jev model id
        required: true
        default: typesafe:jev-1.13.0
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with: {python-version: "3.13"}
      - run: python -m pip install -e '.[dev,jev]'
      - name: Paired benchmark
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: >-
          PYTHONPATH=src python benchmarks/iterate.py
          --dataset '${{ inputs.dataset }}'
          --compare-jev
          --jev-model '${{ inputs.jev_model }}'
          --json-out benchmark-jev.json
      - name: Evidence gate
        run: PYTHONPATH=src python benchmarks/gate.py benchmark-jev.json
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: benchmark-jev
          path: benchmark-jev.json
